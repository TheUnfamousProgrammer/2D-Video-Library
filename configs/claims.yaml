# Every factual statement in the voiceover, captions, description, and comments.
# Computed claims are re-checked against fc_sat.collatz_math on every build.
# The live verification bound was updated from the brief's 2^71 after reading
# https://pcbarina.fit.vutbr.cz/ on 2026-10-02 (2075×2^60, about 2^71.02).

whitelist: ["1", "30"]

claims:
  ends_at_one:
    type: computed
    fn: steps
    args: [1]
    value: 0
    text: "The trajectory stops at 1."
    surfaces: ["1", "one"]
    source: "collatz_math.steps(1) == 0, so 1 is the terminus"
    used_in: [vo, captions, titles, description, reply]

  rule_mul:
    type: computed
    fn: identity
    args: [3]
    value: 3
    text: "An odd number is sent to 3n+1."
    surfaces: ["3", "3n+1"]
    source: "the odd branch is 3n+1"
    used_in: [description]

  rule_addend:
    type: computed
    fn: identity
    args: [1]
    value: 1
    text: "The odd branch adds 1."
    surfaces: ["1", "one"]
    source: "the odd branch is 3n+1"
    used_in: [vo, description]

  start_6:
