  c_verified:
    type: cited
    fn: mul_pow2
    args: [2075, 60]
    value: 2392312122059207475200
    text: "All numbers below 2075×2^60 converge to 1."
    surfaces: ["2075", "60", "2.39 sextillion", "2.39", "two sextillion", "over two sextillion"]
    source: "D. Barina, Improved verification limit for the convergence of the Collatz conjecture, J. Supercomput. 81, 810 (2025), doi 10.1007/s11227-025-07337-0; project page https://pcbarina.fit.vutbr.cz/ checked 2026-10-02 (headline 2075×2^60, log 2^71 on 2025-01-15)."
    used_in: [vo, description, counter]
    recheck_page: true

  c_unproven:
    type: cited
    text: "No accepted proof of the Collatz conjecture is known."
    surfaces: []
    source: "Wikipedia, Collatz conjecture (the problem is unsolved); Barina 2025 introduction. Say still can't prove. Do not say impossible. Do not say nobody has tried."
    used_in: [vo, captions, description]
    language: "still can't prove"

  c_1937:
    type: cited
    verified: true
    text: "Lothar Collatz introduced the idea in 1937."
    surfaces: ["1937"]
    source: "Wikipedia, Collatz conjecture, citing the MacTutor biography of Lothar Collatz, which says he proposed it in 1937. Checked 2026-10-02."
    used_in: [captions]

  c_erdos:
    type: cited
    text: "Mathematics may not be ready for such problems."
    surfaces: []
    source: "Wikipedia, Collatz conjecture, citing Richard K. Guy, Unsolved Problems in Number Theory (3rd ed., 2004)."
    used_in: [comment]
