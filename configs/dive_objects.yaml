# Stops in the deepest-to-highest short, in order. Values come from configs/dive_claims.yaml by id.
#   act: down (depth below sea level) or up (height above sea level, then distance from Earth)
#   kind: structure (drawn to true scale, standing on sea level) or icon (fixed size at its depth or height)
#   label: the small word above the counter
#   art: cutout id in assets/art/scale (keyed from assets/art/objects, or reused from the scale short)
