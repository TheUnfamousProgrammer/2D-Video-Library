# Numbers the coinspin short is allowed to say.
# Computed values are recomputed on every facts run. The film's own spin counts are read
# from gold_pose, the function the renderer draws, with contact and no-slip checked per step.
whitelist: []
claims:
  unit:
    type: definitional
    text: "1 spin is the face coming back upright, counted against the screen"
    value: null
    source: "the counting rule shown under the counter"
    surfaces: ["1"]
    used_in: [sub, card]
  halfway_spins:
    type: computed
    text: "halfway around a same-size coin, the face is already upright again: 1 spin"
    value: 1
    source: "spins of the drawn lap from frame 12 to frame 288"
    surfaces: ["1"]
    used_in: [card, counter]
    fn: segment_spins
    args: [12, 288]
  equal_spins:
    type: computed
    text: "rolled once around a same-size coin, the gold coin spins 2 times"
    value: 2
    source: "film_lap_spins: the drawn lap, contact and no slipping checked"
    surfaces: ["2"]
    used_in: [card, counter, titles, description]
    fn: film_lap_spins
  road_spins:
    type: computed
    text: "rolled along the grey coin's edge laid out flat, it spins 1 time"
    value: 1
    source: "road_spins: 754 px of road over a 120 px radius"
    surfaces: ["1"]
    used_in: [card, counter, description]
    fn: road_spins
  trip_spins:
    type: computed
    text: "bolted to a rod and carried once around without rolling, it still spins 1 time"
    value: 1
    source: "carry_spins: the face turns with the rod"
    surfaces: ["1"]
    used_in: [card, counter, description]
    fn: carry_spins
  sat_year:
    type: cited
    text: "the question appeared on the SAT given in May 1982"
    value: 1982
    source: "Scientific American, The SAT Problem That Everybody Got Wrong (2023); Wikipedia, Coin rotation paradox"
    surfaces: ["1982"]
    used_in: [card, description, titles]
  sat_ratio:
    type: cited
    text: "in the SAT question the radius of circle A is one third the radius of circle B"
    value: 3
    source: "1982 SAT question 17, as quoted by Scientific American (2023)"
    surfaces: ["3"]
    used_in: [card, description]
  sat_intended:
    type: cited
    text: "the test makers' intended answer was 3"
    value: 3
    source: "Scientific American (2023): the writers also thought the answer was three"
    surfaces: ["3"]
    used_in: [card, chip]
  sat_spins:
    type: computed
    text: "around a coin 3 times wider the gold coin spins 4 times, which was not a printed choice"
    value: 4
    source: "sat_lap_spins: the drawn lap, contact and no slipping checked"
    surfaces: ["4"]
    used_in: [card, counter, description]
    fn: sat_lap_spins
  sat_rolling:
    type: computed
    text: "3 of those 4 spins come from rolling along a rim 3 times as long"
    value: 3
    source: "count_spins(3) - carry: rim length over the gold coin's circumference"
    surfaces: ["3"]
    used_in: [counter]
    fn: rolling_part
    args: [3]
  screen_counts:
    type: computed
    text: "every number the counter area shows"
    value: [1, 2, 3, 4]
    source: "scan of the counter schedule over all 1824 frames"
    surfaces: []
    used_in: [counter]
    fn: screen_counts
  ten_ratio:
    type: computed
    text: "the pinned-comment coin is 10 times wider"
    value: 10
    source: "question ratio"
    surfaces: ["10"]
    used_in: [comment]
    fn: identity
    args: [10]
  ten_spins:
    type: computed
    text: "around a coin 10 times wider it spins 11 times"
    value: 11
    source: "count_spins(10)"
    surfaces: ["11"]
    used_in: [reply]
    fn: count_spins
    args: [10]
  inside_spins:
    type: computed
    text: "rolled once around the inside of a ring 3 times wider, it spins 2 times"
    value: 2
    source: "count_spins_inside(3)"
    surfaces: ["2"]
    used_in: [comment_b]
    fn: count_spins_inside
    args: [3]
  tropical_year:
    type: cited
    text: "a mean tropical year is about 365.24 mean solar days"
    value: 365.24219
    source: "Explanatory Supplement to the Astronomical Almanac; Wikipedia, Tropical year"
    surfaces: ["365", "365.24"]
    used_in: [comment_c]
  earth_turns:
    type: computed
    text: "counted against the stars, Earth turns about 366.24 times in that year: the trip around the Sun adds 1"
    value: 366
    source: "floor(365.24219 + 1)"
    surfaces: ["366", "366.24"]
    used_in: [comment_c]
    fn: whole_turns
    args: [365.24219]
  trip_rule:
    type: definitional
    text: "A coin rolled once around a coin k times wider spins k + 1 times: k from rolling along the rim, and 1 from the trip around."
    value: null
    source: "rolling without slipping on a circle"
    surfaces: []
    used_in: [comment_d, description]
