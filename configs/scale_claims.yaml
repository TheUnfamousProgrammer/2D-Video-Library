# Sizes the scale short is allowed to show. One cited claim per object, keyed by object id.
# value is metres; display is the friendly line under the counter (read back and checked
# against value by scale_claims.display_errors); digits sets how many significant digits the
# plain-metres counter keeps. Values were researched and adversarially verified on 2026-10-06;
# caveats are kept in text so the pinned sources comment can quote them.
whitelist: []
claims:
  s01_proton: {type: cited, value: 1.68e-15, digits: 2, display: "1.7 FEMTOMETRES", text: "proton charge diameter, twice the CODATA 2022 rms charge radius of 0.84075 fm; a proton has no hard edge", source: "CODATA 2022 via NIST CUU, physics.nist.gov/cgi-bin/cuu/Value?rp; PDG 0.8409 fm", surfaces: []}
