# Odd One Out, revision 3. Flat fills, a static grid, three levels.
# Frames are round(seconds * fps). Normal tier:
# 6+7+8 + three 1.2 s reveals + two 0.2 s dissolves + 2.0 s outro = 27.0 s.
generator: odd
seed: 7
tier: normal
width: 1080
height: 1920
fps: 60
workers: 0
reveal_seconds: 1.2
dissolve_seconds: 0.2
outro_seconds: 2.0
# Items fade from this opacity to 1 over pop_seconds. 0.5 keeps frame 0 readable.
pop_seconds: 0.2
pop_floor: 0.5
hook: Find the odd one
cta: Comment your level
background: "#14171F"

# 1 is easiest. The tables live in code. CVD floor is half the hue distance.
rung:
  hue: 2
  tilt: 3
  detail: 4

levels:
  - id: 1
    difference: hue
    grid: 5
    size: 90
    timer: 6.0
  - id: 2
    difference: tilt
    grid: 6
    size: 84
    timer: 7.0
  - id: 3
    difference: detail
    grid: 7
    size: 76
    timer: 8.0
  - id: 4
    difference: hue
    grid: 7
    size: 76
    timer: 9.0
    rung: 5

field:
  x0: 150
  x1: 930
  y0: 520
  y1: 1300
  corner_radius: 24
  outline: 2
  outline_color: "#2A2F3A"

item:
  corner_frac: 0.18
  ring_color: "#FFD166"
  ring_px: 8
  ring_from: 1.0
  ring_to: 1.35
  ring_grow: 0.25
  fade_seconds: 0.15
  fade_alpha: 0.30
  detail_mode: moved
  dot_fraction: 0.14

layout:
  safe_x: [130, 950]
  safe_y: [200, 1536]
  label_y: 300
  label_px: 60
  caption_y: 380
  caption_px: 52
  caption_max_chars: 26
  caption_x: [150, 930]
  timer_y: 450
  timer_x0: 170
  timer_x1: 770
  timer_h: 14
  timer_num_x0: 790
  timer_num_x1: 930
  timer_num_px: 64
  timer_color: "#E6E8EE"
  timer_red: "#E5484D"
  red_seconds: 1.5
  outro_y: 420
  outro_px: 52
  cta_y: 1450
  cta_px: 40
  hook_seconds: 3.0

constraints:
  max_attempts: 20

audio:
  tone_seconds: 0.3
  double_tick_window: 2.0

# Easy uses rung 1. Hard adds level 4 at hue rung 5 and otherwise keeps these rungs.
tiers:
  normal:
    level_ids: [1, 2, 3]
    base_l: 0.72
    base_c: 0.10
  easy:
    level_ids: [1, 2, 3]
    rung:
      hue: 1
      tilt: 1
      detail: 1
    base_l: 0.72
    base_c: 0.10
  hard:
    level_ids: [1, 2, 3, 4]
    base_l: 0.72
    base_c: 0.10
