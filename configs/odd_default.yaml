# Odd One Out, revision 2. Flat fills, a static grid, three levels.
# Frames are round(seconds * fps). Normal tier:
# 5+6+7 + three 1.2 s reveals + two 0.2 s dissolves + 2.0 s outro = 24.0 s.
generator: odd
seed: 7
tier: normal
width: 1080
height: 1920
fps: 60
workers: 0
reveal_seconds: 1.2
dissolve_seconds: 0.2
outro_seconds: 2.0
# Items fade from this opacity to 1 over pop_seconds. 0.5 keeps frame 0 readable.
pop_seconds: 0.2
pop_floor: 0.5
hook: Find the odd one
cta: Comment your level
background: "#14171F"

levels:
  - id: 1
    difference: hue
    grid: 4
    size: 100
    timer: 5.0
  - id: 2
    difference: tilt
    grid: 5
    size: 96
    timer: 6.0
  - id: 3
    difference: detail
    grid: 6
    size: 88
    timer: 7.0
  - id: 4
    difference: hue_subtle
    grid: 6
    size: 88
    timer: 8.0

field:
  x0: 150
  x1: 930
  y0: 520
  y1: 1300
  corner_radius: 24
  outline: 2
  outline_color: "#2A2F3A"

item:
  corner_frac: 0.18
  ring_color: "#FFD166"
  ring_px: 8
  ring_from: 1.0
  ring_to: 1.35
  ring_grow: 0.25
  fade_seconds: 0.15
  fade_alpha: 0.30

layout:
  safe_x: [130, 950]
  safe_y: [200, 1536]
  label_y: 300
  label_px: 60
  caption_y: 380
  caption_px: 52
  caption_max_chars: 26
  caption_x: [150, 930]
  timer_y: 450
  timer_x0: 170
  timer_x1: 770
  timer_h: 14
  timer_num_x0: 790
  timer_num_x1: 930
  timer_num_px: 64
  timer_color: "#E6E8EE"
  timer_red: "#E5484D"
  red_seconds: 1.5
  outro_y: 420
  outro_px: 52
  cta_y: 1450
  cta_px: 40
  hook_seconds: 3.0

constraints:
  max_attempts: 20

audio:
  tone_seconds: 0.3
  double_tick_window: 2.0

# Easy makes the gap bigger. Hard adds level 4. Neither drops a CVD floor.
tiers:
  normal:
    level_ids: [1, 2, 3]
    hue_min_distance: 0.25
    hue_min_lightness: 0.15
    cvd_min_distance: 0.12
    tilt_degrees: 22
    tilt_range: [15, 35]
    dot_fraction: 0.16
    detail_mode: missing
    hue_subtle_distance: 0.10
    hue_subtle_lightness: 0.06
    hue_subtle_cvd: 0.06
    base_l: 0.72
    base_c: 0.10
  easy:
    level_ids: [1, 2, 3]
    hue_min_distance: 0.35
    hue_min_lightness: 0.22
    cvd_min_distance: 0.12
    tilt_degrees: 32
    tilt_range: [15, 35]
    dot_fraction: 0.22
    detail_mode: missing
    hue_subtle_distance: 0.10
    hue_subtle_lightness: 0.06
    hue_subtle_cvd: 0.06
    base_l: 0.72
    base_c: 0.10
  hard:
    level_ids: [1, 2, 3, 4]
    hue_min_distance: 0.25
    hue_min_lightness: 0.15
    cvd_min_distance: 0.12
    tilt_degrees: 22
    tilt_range: [15, 35]
    dot_fraction: 0.16
    detail_mode: missing
    hue_subtle_distance: 0.10
    hue_subtle_lightness: 0.06
    hue_subtle_cvd: 0.06
    base_l: 0.72
    base_c: 0.10
