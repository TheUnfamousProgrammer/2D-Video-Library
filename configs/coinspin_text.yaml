# On-screen copy for the coinspin short. Top lines are at most 16 characters, at most 3 lines.
# Digits survive only when the card names the claim that computed or cited them.
# Every card changes on the frame its scene changes. The hook shows on 0-143 and 1800-1823.
hooks:
  A:
    - "ROLL THE GOLD"
    - "COIN AROUND."
    - "HOW MANY SPINS?"
  B:
    - "SAME SIZE COINS."
    - "ONE LAP AROUND."
    - "HOW MANY SPINS?"
  D:
    - "EVEN THE SAT"
    - "GOT THIS WRONG."
    - "HOW MANY SPINS?"
cards:
  - id: guess
    start: 144
    end: 288
    lines: ["SAME SIZE COINS.", "SO JUST {unit} SPIN?"]
    claims: [unit]
  - id: halfway
    start: 288
    end: 384
    lines: ["HALFWAY THERE...", "ALREADY {halfway_spins} SPIN!"]
    gold: ["{halfway_spins} SPIN"]
    claims: [halfway_spins]
  - id: other_half
    start: 384
    end: 576
    lines: ["OTHER HALF:", "WATCH THE FACE."]
  - id: wait
    start: 576
    end: 768
    lines: ["WAIT FOR IT..."]
  - id: two
    start: 768
    end: 876
    lines: ["NOT {unit} SPIN.", "{equal_spins} SPINS!"]
    gold: ["{equal_spins} SPINS!"]
    claims: [unit, equal_spins]
  - id: why
    start: 876
    end: 1032
    lines: ["WHY {equal_spins}?", "LAY THE GREY", "EDGE OUT FLAT:"]
    claims: [equal_spins]
  - id: rolled
    start: 1032
    end: 1104
    lines: ["{road_spins} SPIN. THE ONE", "YOU EXPECTED."]
    claims: [road_spins]
  - id: bolted
    start: 1104
    end: 1224
    lines: ["NO ROLLING NOW.", "IT'S BOLTED ON.", "JUST GO AROUND:"]
  - id: trip
    start: 1224
    end: 1344
    lines: ["IT STILL SPUN", "ONCE, JUST FROM", "THE TRIP AROUND!"]
  - id: sat_ask
    start: 1344
    end: 1572
    lines: ["{sat_year} SAT ASKED:", "GREY COIN IS {sat_ratio}X", "WIDER. SPINS?"]
    claims: [sat_year, sat_ratio]
  - id: sat_said
    start: 1572
    end: 1632
    lines: ["THE SAT SAID {sat_intended}.", "NOT BACK YET!"]
    claims: [sat_intended]
  - id: four
    start: 1632
    end: 1800
    lines: ["IT'S {sat_spins}.", "EACH TRIP AROUND", "ADDS {trip_spins} SPIN."]
    gold: ["{sat_spins}"]
    claims: [sat_spins, trip_spins]
