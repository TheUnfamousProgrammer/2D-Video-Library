    fn: pass_length
    args: ["earth"]
  sun_folds:
    type: computed
    text: "first fold whose stack passes the Sun, in theory"
    value: 51
    source: "smallest n with h(n) >= 1 AU"
    surfaces: ["51"]
    usage: [comment]
    fn: pass_distance
    args: ["sun"]
  au_times_30:
    type: computed
    text: "30 folds of paper, in Earth-Sun distances, two significant figures"
    value: 400
    source: "round(L(30) / 1 AU, 2 significant figures)"
    surfaces: ["400"]
    usage: [twist]
    fn: au_times
    args: [30]
  au_times_32:
    type: computed
    text: "32 folds of paper, in Earth-Sun distances, two significant figures"
    value: 6500
    source: "round(L(32) / 1 AU, 2 significant figures)"
    surfaces: ["6500", "6,500"]
    usage: [twist]
    fn: au_times
    args: [32]
  ly_42:
    type: computed
    text: "42 folds of paper, in light-years, three significant figures"
    value: 107000
    source: "round(L(42) / 1 light-year, 3 significant figures). Exact quotient is about 107,052."
    surfaces: ["107,000", "107000"]
    usage: [climax]
    fn: ly_round
    args: [42]
  space_km:
    type: computed
    text: "the 30-fold stack in kilometres, three significant figures"
    value: 107
    source: "round(h(30) in km, 3 significant figures). Exact value is 107.374 km."
    surfaces: ["107"]
    usage: [drop]
    fn: km_round
    args: [30]
  record_cm:
    type: computed
    text: "the 12-fold stack in centimetres"
    value: 41
    source: "round(h(12) to the nearest centimetre). Exact value is 40.96 cm."
    surfaces: ["41"]
    usage: [reality]
